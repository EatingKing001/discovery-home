  <div class="tm-overlay" id="cooperation-dialog" aria-hidden="true">
    <form class="tm-panel cooperation-panel" role="dialog" aria-modal="true" aria-labelledby="cooperation-title" aria-describedby="cooperation-form-error" data-cooperation-form novalidate>
      <header class="tm-header">
        <h2 class="tm-title" id="cooperation-title">申请合作</h2>
        <button class="tm-close" type="button" data-dialog-close aria-label="关闭申请合作表单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </header>
      <div class="tm-body">
        <div class="cooperation-grid">
          <div class="tm-field"><label class="tm-label" for="cooperation-name">姓名 <span class="tm-req">*</span></label><input class="tm-input" id="cooperation-name" name="name" required autocomplete="name"></div>
          <div class="tm-field"><label class="tm-label" for="cooperation-phone">手机号 <span class="tm-req">*</span></label><input class="tm-input" id="cooperation-phone" name="phone" type="tel" required autocomplete="tel"></div>
          <div class="tm-field"><label class="tm-label" for="cooperation-org">学校/单位 <span class="tm-req">*</span></label><input class="tm-input" id="cooperation-org" name="organization" required autocomplete="organization"></div>
          <div class="tm-field"><label class="tm-label" for="cooperation-position">职位 <span class="tm-req">*</span></label><input class="tm-input" id="cooperation-position" name="position" required autocomplete="organization-title"></div>
        </div>
        <fieldset class="tm-field">
          <legend class="tm-label">研究方向 <span class="tm-req">*</span></legend>
          <div class="tm-chips" role="radiogroup" aria-label="研究方向" aria-required="true">
            <button class="tm-chip is-active" type="button" role="radio" aria-checked="true">生命科学</button>
            <button class="tm-chip" type="button" role="radio" aria-checked="false" tabindex="-1">地球科学</button><button class="tm-chip" type="button" role="radio" aria-checked="false" tabindex="-1">物质科学</button><button class="tm-chip" type="button" role="radio" aria-checked="false" tabindex="-1">神经科学</button><button class="tm-chip" type="button" role="radio" aria-checked="false" tabindex="-1">空间科学</button><button class="tm-chip" type="button" role="radio" aria-checked="false" tabindex="-1">物理科学</button><button class="tm-chip" type="button" role="radio" aria-checked="false" tabindex="-1">数学</button><button class="tm-chip" type="button" role="radio" aria-checked="false" tabindex="-1">化学</button><button class="tm-chip" type="button" role="radio" aria-checked="false" tabindex="-1">其他</button>
          </div>
        </fieldset>
        <div class="tm-field"><label class="tm-label" for="research-content">具体研究内容 <span class="tm-opt">选填</span></label><textarea class="tm-textarea" id="research-content" name="researchContent" rows="3"></textarea></div>
        <fieldset class="tm-field" data-method-field aria-required="true">
          <legend class="tm-label">希望合作方式 <span class="tm-req">*</span></legend>
          <div class="tm-checks">
            <label class="tm-check"><input type="checkbox" name="cooperationMethod" value="联合课题研究"><span class="tm-check-box" aria-hidden="true"></span>联合课题研究</label>
            <label class="tm-check"><input type="checkbox" name="cooperationMethod" value="科研资源接入"><span class="tm-check-box" aria-hidden="true"></span>科研资源接入</label>
            <label class="tm-check"><input type="checkbox" name="cooperationMethod" value="其他"><span class="tm-check-box" aria-hidden="true"></span>其他</label>
          </div>
        </fieldset>
        <div class="tm-field"><label class="tm-label" for="cooperation-content">具体可合作内容 <span class="tm-opt">选填</span></label><textarea class="tm-textarea" id="cooperation-content" name="cooperationContent" rows="3"></textarea></div>
        <p class="tm-error-message" id="cooperation-form-error" data-form-error role="alert"></p>
      </div>
      <footer class="tm-footer"><button class="tm-btn tm-btn-ghost" type="button" data-dialog-close>取消</button><button class="tm-btn tm-btn-primary" type="submit">提交申请</button></footer>
    </form>
  </div>
  <div class="app-toast success" id="shell-toast" role="status" aria-live="polite" aria-atomic="true"></div>
